# Frontend CI Pipeline
# Builds the Blazor WebAssembly app on every push/PR to main.
# On push to main, deploys to Azure Static Web Apps.
# On pull requests, creates an automatic preview environment.
#
# Triggers:
#   - Push to main branch (if frontend files changed)
#   - Pull requests targeting main (if frontend files changed)
#
# Required GitHub secrets (set by infrastructure-ci.yml after infra deploy):
#   AZURE_STATIC_WEB_APPS_API_TOKEN — deployment token from Static Web Apps
#
# Cost: Free for public repositories (unlimited minutes)

name: Frontend CI

permissions:
  contents: read
  pull-requests: write # Needed to post the preview URL comment on PRs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
      - "src/shared/**"
      - "tests/MTGCollectionTracker.Client.Tests/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/frontend/**"
      - "src/shared/**"
      - "tests/MTGCollectionTracker.Client.Tests/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Step 3: Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore MTGCollectionTracker.Frontend.slnx

      # Step 4: Check for known vulnerable packages (fails build if any found)
      - name: Audit for vulnerabilities
        run: dotnet list MTGCollectionTracker.Frontend.slnx package --vulnerable --include-transitive

      # Step 5: Build in Release mode
      - name: Build
        run: dotnet build MTGCollectionTracker.Frontend.slnx --configuration Release --no-restore

      # Step 6: Run tests
      - name: Test
        run: dotnet test MTGCollectionTracker.Frontend.slnx --configuration Release --no-build --verbosity normal

      # Step 7: Publish Blazor WASM output (only when deploying)
      - name: Publish
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          dotnet publish src/frontend/MTGCollectionTracker.Client/MTGCollectionTracker.Client.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

  deploy:
    name: Deploy to Static Web Apps
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: |
          dotnet publish src/frontend/MTGCollectionTracker.Client/MTGCollectionTracker.Client.csproj \
            --configuration Release \
            --output ./publish

      # Deploys to production on push to main.
      # Deploys to an auto-generated preview URL on pull requests.
      # The action automatically posts the preview URL as a PR comment.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Blazor WASM publish output lands in wwwroot
          app_location: "/"
          output_location: "publish/wwwroot"
          skip_app_build: true # We build with dotnet publish above
          skip_deploy_on_missing_secrets: true # No-op until infra deploy sets the token
