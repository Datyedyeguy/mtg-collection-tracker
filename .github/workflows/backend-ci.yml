# Backend CI Pipeline
# Builds and tests the ASP.NET Core API on every push/PR to main.
# On push to main, also runs EF migrations and deploys to Azure App Service.
#
# Triggers:
#   - Push to main branch (if backend files changed)
#   - Pull requests targeting main (if backend files changed)
#
# Required GitHub secrets (set by scripts/bootstrap-azure.ps1):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP
#
# Required GitHub secrets (set manually):
#   AZURE_API_APP_NAME  — the App Service name output by infrastructure-ci
#   DB_CONNECTION_STRING — Npgsql connection string for running EF migrations
#
# Cost: Free for public repositories (unlimited minutes)

name: Backend CI

permissions:
  contents: read
  id-token: write # Required for OIDC authentication to Azure

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - "src/shared/**"
      - "tests/**"
      - "Directory.Build.props"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    # No path filter on PRs — the workflow must always run so branch protection
    # sees a status. The build job detects changed paths and exits early if
    # no relevant files were modified.

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for changed-files detection on PRs

      # Step 1b: Detect whether any backend-relevant files changed.
      # On push events the path filter above already handles this; on PRs we
      # do it here so we can skip the build when only docs/infra changed.
      - name: Check for relevant file changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
            echo "Changed files:"
            echo "$CHANGED"
            if echo "$CHANGED" | grep -qE '^(src/backend/|src/shared/|tests/|Directory\.Build\.props|\.github/workflows/backend-ci\.yml)'; then
              echo "relevant=true" >> $GITHUB_OUTPUT
            else
              echo "relevant=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "relevant=true" >> $GITHUB_OUTPUT
          fi

      - name: Skip (no relevant changes)
        if: steps.changes.outputs.relevant == 'false'
        run: echo "No backend files changed — skipping build and test."

      # Step 2: Install .NET SDK
      - name: Setup .NET
        if: steps.changes.outputs.relevant != 'false'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Step 3: Restore NuGet packages
      - name: Restore dependencies
        if: steps.changes.outputs.relevant != 'false'
        run: dotnet restore MTGCollectionTracker.Backend.slnx

      # Step 4: Check for known vulnerable packages (fails build if any found)
      - name: Audit for vulnerabilities
        if: steps.changes.outputs.relevant != 'false'
        run: dotnet list MTGCollectionTracker.Backend.slnx package --vulnerable --include-transitive

      # Step 5: Build in Release mode
      - name: Build
        if: steps.changes.outputs.relevant != 'false'
        run: dotnet build MTGCollectionTracker.Backend.slnx --configuration Release --no-restore

      # Step 6: Run tests
      - name: Test
        if: steps.changes.outputs.relevant != 'false'
        run: dotnet test MTGCollectionTracker.Backend.slnx --configuration Release --no-build --verbosity normal

      # Step 7: Publish release artifact (only when deploying)
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet publish src/backend/MTGCollectionTracker.Api/MTGCollectionTracker.Api.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: api-publish
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Run EF Core migrations BEFORE deploying new code.
      # This ensures the database schema is updated before the app that depends
      # on it goes live (backwards-compatible migrations only — see ADR decisions).
      - name: Run EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update \
            --project src/backend/MTGCollectionTracker.Data/MTGCollectionTracker.Data.csproj \
            --startup-project src/backend/MTGCollectionTracker.Api/MTGCollectionTracker.Api.csproj \
            --no-build
        env:
          # EF needs the connection string to connect to the production DB
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
          ASPNETCORE_ENVIRONMENT: Production

      # Deploy the published artifact to App Service
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          package: ./publish

      - name: Smoke test — health check
        run: |
          sleep 10   # Give App Service a moment to restart
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.AZURE_API_APP_NAME }}.azurewebsites.net/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check returned HTTP $STATUS"
            exit 1
          fi
          echo "✅ Health check passed (HTTP $STATUS)"
